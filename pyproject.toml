[project]
name = "triptrackapp"
version = "0.1.0"
description = "A light weight Android app for tracking drives to and from work that exports to csv."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flet>=0.28.3",
    "kivy>=2.3.0",
    "pillow>=10.0.0",
    "pygame>=2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
